name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open("package.json", encoding="utf-8") as f:
              npm_version = json.load(f)["version"]
          with open("package-lock.json", encoding="utf-8") as f:
              npm_lock = json.load(f)
          with open("src-tauri/tauri.conf.json", encoding="utf-8") as f:
              tauri_version = json.load(f)["version"]
          with open("src-tauri/Cargo.toml", encoding="utf-8") as f:
              cargo_version = re.search(
                  r'^version\s*=\s*"([^"]+)"', f.read(), re.MULTILINE
              ).group(1)
          with open("src-tauri/Cargo.lock", encoding="utf-8") as f:
              cargo_lock_version = re.search(
                  r'\[\[package\]\]\nname = "o2cloud-app"\nversion = "([^"]+)"',
                  f.read(),
              ).group(1)

          versions = {
              "package.json": npm_version,
              "package-lock.json": npm_lock["version"],
              "package-lock.json packages['']": npm_lock["packages"][""]["version"],
              "src-tauri/tauri.conf.json": tauri_version,
              "src-tauri/Cargo.toml": cargo_version,
              "src-tauri/Cargo.lock": cargo_lock_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Version mismatch: {versions}")

          expected = f"v{tauri_version}"
          if os.environ["TAG"] != expected:
              raise SystemExit(
                  f"Tag {os.environ['TAG']} does not match app version {expected}"
              )
          print(f"Releasing {expected}")
          PY

      - name: Check the signing secrets
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (see RELEASING.md)."
            exit 1
          fi
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_PASSWORD" ]; then
            echo "::error::Set the MACOS_SIGNING_CERTIFICATE and MACOS_SIGNING_CERTIFICATE_PASSWORD secrets (see RELEASING.md)."
            exit 1
          fi

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$TAG" --json databaseId,isDraft 2>/dev/null)"; then
            release_id="$(printf '%s' "$release_json" | jq -r .databaseId)"
            is_draft="$(printf '%s' "$release_json" | jq -r .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace its assets."
              exit 1
            fi
            echo "Reusing draft release $release_id"
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "O2 Cloud $TAG" \
              --notes-file .github/release-body.md
            release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos.release.conf.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis,msi --config src-tauri/tauri.windows.release.conf.json
            targets: ""
          - platform: ubuntu-22.04
            args: --bundles appimage,deb --config src-tauri/tauri.linux.release.conf.json
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Bundle the o2cloud CLI (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          CLI_VERSION: 1.4.2
        run: |
          set -euo pipefail
          base="https://github.com/danielperez9430/o2cloud-cli/releases/download/v${CLI_VERSION}"
          mkdir -p src-tauri/bin/macos-aarch64 src-tauri/bin/macos-x86_64

          curl -fsSL "$base/o2cloud-aarch64-apple-darwin.tar.gz" \
            -o "$RUNNER_TEMP/o2cloud-aarch64.tar.gz"
          curl -fsSL "$base/o2cloud-x86_64-apple-darwin.tar.gz" \
            -o "$RUNNER_TEMP/o2cloud-x86_64.tar.gz"

          echo "76d852cabc9863dbf363b4c39134455711a4565cd1c5de1fa908dd1c7d872297  $RUNNER_TEMP/o2cloud-aarch64.tar.gz" \
            | shasum -a 256 -c -
          echo "1d1fc68d8eee071cf414751acfca2de87336b4d57a3d0724d85a904496f352e5  $RUNNER_TEMP/o2cloud-x86_64.tar.gz" \
            | shasum -a 256 -c -

          tar -xzf "$RUNNER_TEMP/o2cloud-aarch64.tar.gz" -C src-tauri/bin/macos-aarch64
          tar -xzf "$RUNNER_TEMP/o2cloud-x86_64.tar.gz" -C src-tauri/bin/macos-x86_64
          chmod +x src-tauri/bin/macos-aarch64/o2cloud src-tauri/bin/macos-x86_64/o2cloud

          src-tauri/bin/macos-aarch64/o2cloud --version
          src-tauri/bin/macos-x86_64/o2cloud --version

      - name: Bundle the o2cloud CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          CLI_VERSION: 1.4.2
          CLI_SHA256: 82afa1020400f582b176d9d2ff81277b7edf71df87b88160eda6394c507e1d27
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "o2cloud-windows.zip"
          $url = "https://github.com/danielperez9430/o2cloud-cli/releases/download/v$env:CLI_VERSION/o2cloud-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($hash -ne $env:CLI_SHA256) {
            throw "o2cloud CLI checksum mismatch: $hash"
          }

          New-Item -ItemType Directory -Force -Path "src-tauri/bin/windows-x86_64" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "src-tauri/bin/windows-x86_64" -Force
          # Do not carry the download's Mark-of-the-Web into the installer.
          Unblock-File -Path "src-tauri/bin/windows-x86_64/o2cloud.exe"

          & "src-tauri/bin/windows-x86_64/o2cloud.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "the downloaded o2cloud CLI does not run"
          }

      - name: Build the o2cloud CLI (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          CLI_COMMIT: cfa201b32485f53617e7a0f1938b4ff486dff20d
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.4.2 \
            https://github.com/danielperez9430/o2cloud-cli.git \
            "$RUNNER_TEMP/o2cloud-cli"
          test "$(git -C "$RUNNER_TEMP/o2cloud-cli" rev-parse HEAD)" = "$CLI_COMMIT"

          (
            cd "$RUNNER_TEMP/o2cloud-cli"
            cargo build --release --locked
          )

          install -Dm755 "$RUNNER_TEMP/o2cloud-cli/target/release/o2cloud" \
            src-tauri/bin/linux-x86_64/o2cloud
          src-tauri/bin/linux-x86_64/o2cloud --version

      # The app is signed with the project's own self-signed certificate,
      # not ad hoc: macOS ties the Photos permission to the signature, and
      # an ad-hoc one changes with every build, so each update lost it.
      # Gatekeeper still warns (it isn't notarized). Imported here rather
      # than through APPLE_CERTIFICATE, which Tauri only accepts from Apple.
      - name: Import the macOS signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          IDENTITY: O2 Cloud self-signed (dcarnicer)
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          # codesign looks for the identity in the user's keychains.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain" | grep -F "\"$IDENTITY\""
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (.app.tar.gz, setup.exe, .msi,
          # .AppImage, .deb); the app checks them against the public key in
          # tauri.conf.json. latest.json is written by the updater-json job.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}

  updater-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Download the updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p sigs
          gh release download "$TAG" --dir sigs --pattern "*.sig"
          ls -l sigs

      # One job after every build writes the whole manifest, so parallel
      # builds can't overwrite each other's platforms. Each installer type
      # gets its own key ({os}-{arch}-{bundle}), which the app looks up
      # first: an .msi or .deb install is updated with an .msi or .deb, never
      # with another installer that would leave a second copy.
      - name: Write latest.json
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64
          import datetime
          import json
          import os
          import pathlib

          repo = os.environ["GH_REPO"]
          tag = os.environ["TAG"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def key_id(minisign_b64):
              # A minisign key or signature: a comment line, then base64 of
              # 2 bytes of algorithm, 8 of key ID and the rest.
              line = base64.b64decode(minisign_b64).decode().splitlines()[1]
              return base64.b64decode(line)[2:10]

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as f:
              pubkey = json.load(f)["plugins"]["updater"]["pubkey"]
          expected = key_id(pubkey)

          sigs = {
              p.name[: -len(".sig")]: p.read_text(encoding="utf-8").strip()
              for p in pathlib.Path("sigs").glob("*.sig")
          }

          def entry(suffix):
              names = [n for n in sigs if n.endswith(suffix)]
              if len(names) != 1:
                  raise SystemExit(f"Expected one {suffix} signature, found {names}")
              name = names[0]
              if key_id(sigs[name]) != expected:
                  raise SystemExit(f"{name} is not signed with the app's updater key")
              return {"signature": sigs[name], "url": f"{base}/{name}"}

          mac = entry("_universal.app.tar.gz")
          nsis = entry("-setup.exe")
          msi = entry(".msi")
          appimage = entry(".AppImage")
          deb = entry(".deb")
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": {
                  # The universal app serves both Macs.
                  "darwin-aarch64-app": mac,
                  "darwin-x86_64-app": mac,
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "windows-x86_64-nsis": nsis,
                  "windows-x86_64-msi": msi,
                  "linux-x86_64-appimage": appimage,
                  "linux-x86_64-deb": deb,
              },
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" latest.json --clobber

  checksums:
    needs: [create-release, build, updater-json]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --dir assets --pattern "*" --skip-existing

      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | while IFS= read -r file; do sha256sum "$file"; done \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" assets/SHA256SUMS.txt --clobber
