name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open("package.json", encoding="utf-8") as f:
              npm_version = json.load(f)["version"]
          with open("package-lock.json", encoding="utf-8") as f:
              npm_lock = json.load(f)
          with open("src-tauri/tauri.conf.json", encoding="utf-8") as f:
              tauri_version = json.load(f)["version"]
          with open("src-tauri/Cargo.toml", encoding="utf-8") as f:
              cargo_version = re.search(
                  r'^version\s*=\s*"([^"]+)"', f.read(), re.MULTILINE
              ).group(1)
          with open("src-tauri/Cargo.lock", encoding="utf-8") as f:
              cargo_lock_version = re.search(
                  r'\[\[package\]\]\nname = "o2cloud-app"\nversion = "([^"]+)"',
                  f.read(),
              ).group(1)

          versions = {
              "package.json": npm_version,
              "package-lock.json": npm_lock["version"],
              "package-lock.json packages['']": npm_lock["packages"][""]["version"],
              "src-tauri/tauri.conf.json": tauri_version,
              "src-tauri/Cargo.toml": cargo_version,
              "src-tauri/Cargo.lock": cargo_lock_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Version mismatch: {versions}")

          expected = f"v{tauri_version}"
          if os.environ["TAG"] != expected:
              raise SystemExit(
                  f"Tag {os.environ['TAG']} does not match app version {expected}"
              )
          print(f"Releasing {expected}")
          PY

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$TAG" --json databaseId,isDraft 2>/dev/null)"; then
            release_id="$(printf '%s' "$release_json" | jq -r .databaseId)"
            is_draft="$(printf '%s' "$release_json" | jq -r .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace its assets."
              exit 1
            fi
            echo "Reusing draft release $release_id"
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "O2 Cloud $TAG" \
              --notes-file .github/release-body.md
            release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos.release.conf.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis,msi --config src-tauri/tauri.windows.release.conf.json
            targets: ""
          - platform: ubuntu-22.04
            args: --bundles appimage,deb --config src-tauri/tauri.linux.release.conf.json
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Bundle the o2cloud CLI (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          CLI_VERSION: 1.3.1
        run: |
          set -euo pipefail
          base="https://github.com/danielperez9430/o2cloud-cli/releases/download/v${CLI_VERSION}"
          mkdir -p src-tauri/bin/macos-aarch64 src-tauri/bin/macos-x86_64

          curl -fsSL "$base/o2cloud-aarch64-apple-darwin.tar.gz" \
            -o "$RUNNER_TEMP/o2cloud-aarch64.tar.gz"
          curl -fsSL "$base/o2cloud-x86_64-apple-darwin.tar.gz" \
            -o "$RUNNER_TEMP/o2cloud-x86_64.tar.gz"

          echo "3708b0e13eb94c8e54a9d2b0e61570b2b67a1b65f68e8a6f65967930e4b55422  $RUNNER_TEMP/o2cloud-aarch64.tar.gz" \
            | shasum -a 256 -c -
          echo "193189a5f78d7ffbb03595a079b374a48ffa24adc2e90e66c2b68e4fcfbb8d8e  $RUNNER_TEMP/o2cloud-x86_64.tar.gz" \
            | shasum -a 256 -c -

          tar -xzf "$RUNNER_TEMP/o2cloud-aarch64.tar.gz" -C src-tauri/bin/macos-aarch64
          tar -xzf "$RUNNER_TEMP/o2cloud-x86_64.tar.gz" -C src-tauri/bin/macos-x86_64
          chmod +x src-tauri/bin/macos-aarch64/o2cloud src-tauri/bin/macos-x86_64/o2cloud

          src-tauri/bin/macos-aarch64/o2cloud --version
          src-tauri/bin/macos-x86_64/o2cloud --version

      - name: Bundle the o2cloud CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          CLI_VERSION: 1.3.1
          CLI_SHA256: 1e85dc5ca818c6403b55179fa251cfa85481a7afc0863666f795a9ddee7cf2eb
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "o2cloud-windows.zip"
          $url = "https://github.com/danielperez9430/o2cloud-cli/releases/download/v$env:CLI_VERSION/o2cloud-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($hash -ne $env:CLI_SHA256) {
            throw "o2cloud CLI checksum mismatch: $hash"
          }

          New-Item -ItemType Directory -Force -Path "src-tauri/bin/windows-x86_64" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "src-tauri/bin/windows-x86_64" -Force
          # Do not carry the download's Mark-of-the-Web into the installer.
          Unblock-File -Path "src-tauri/bin/windows-x86_64/o2cloud.exe"

          & "src-tauri/bin/windows-x86_64/o2cloud.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "the downloaded o2cloud CLI does not run"
          }

      - name: Build the o2cloud CLI (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          CLI_COMMIT: 49c81bd32c3493ec664667709d221bacdfd65f2f
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1 \
            https://github.com/danielperez9430/o2cloud-cli.git \
            "$RUNNER_TEMP/o2cloud-cli"
          test "$(git -C "$RUNNER_TEMP/o2cloud-cli" rev-parse HEAD)" = "$CLI_COMMIT"

          (
            cd "$RUNNER_TEMP/o2cloud-cli"
            cargo build --release --locked
          )

          install -Dm755 "$RUNNER_TEMP/o2cloud-cli/target/release/o2cloud" \
            src-tauri/bin/linux-x86_64/o2cloud
          src-tauri/bin/linux-x86_64/o2cloud --version

      - name: Configure ad-hoc signing (macOS)
        if: matrix.platform == 'macos-latest'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}

  checksums:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --dir assets --pattern "*" --skip-existing

      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | while IFS= read -r file; do sha256sum "$file"; done \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" assets/SHA256SUMS.txt --clobber
